[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optsim"
version = "0.1.0"
description = "Моделирование скалярной волновой оптики на GPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/optsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
